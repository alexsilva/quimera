[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "quimera"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "rich>=14.0",
    "textual>=0.86",
    "openai>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["ruff>=0.15,<0.16", "mypy>=2.4,<2.5"]
docs = ["mkdocs>=1.6"]
browser = ["playwright>=1.50"]
oauth-store = ["cryptography>=42"]

[project.scripts]
quimera = "quimera.cli:main"
quimera-fake = "quimera.devtools.fake_agents:main"

[tool.setuptools.packages.find]
include = ["quimera*"]

[tool.setuptools_scm]
fallback_version = "0.1.0"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::UserWarning:rich",
]
norecursedirs = ["tmp", ".claude"]

# ---------------------------------------------------------------------------
# Gates de qualidade (scripts/check.sh; hook em scripts/git-hooks/pre-commit)
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py310"
extend-exclude = ["tmp", ".claude"]

[tool.ruff.lint]
# Conjunto bloqueante: erros de sintaxe/semântica e pyflakes. Regras novas
# entram aqui só com a base limpa, para o gate continuar sendo zero erro.
select = [
    "E4", "E7", "E9", "F",
    "B904",     # raise dentro de except sem from: perde a causa original
    "PLW0603",  # global: só com noqa e a justificativa na linha
    "PLW2901",  # variável do laço reatribuída dentro do laço
    "RUF012",   # mutável como atributo de classe: exige ClassVar explícito
]

[tool.mypy]
python_version = "3.10"
files = ["quimera"]
show_error_codes = true
warn_unused_configs = true
# `annotation-unchecked` é só uma nota sobre funções sem anotação; o gate
# cobre as anotadas (74% do código) e tudo que for anotado daqui em diante.
disable_error_code = ["annotation-unchecked"]

# Imports de terceiros sem stubs: só os extras opcionais `oauth-store` e
# `browser`. Não usar `ignore_missing_imports` global, que também silenciaria
# um módulo quimera.* apagado enquanto ainda importado.
[[tool.mypy.overrides]]
module = ["cryptography.*", "playwright.*"]
ignore_missing_imports = true

# Baseline de dívida: módulos que já tinham erros quando o gate nasceu
# (281 erros em 70 módulos, 2026-10-18). O gate protege os demais módulos
# e todo módulo novo. Ao corrigir um módulo, remova-o desta lista: ele passa a
# ser protegido. Não adicione módulos aqui.
[[tool.mypy.overrides]]
module = [
    "quimera.app.core_facade",
    "quimera.app.dispatch",
    "quimera.app.inputs",
    "quimera.app.system_layer",
    "quimera.app.toolbar",
    "quimera.devtools.fake_agents",
    "quimera.profiles.opencode",
    "quimera.prompt_templates",
    "quimera.runtime.approval",
    "quimera.runtime.drivers.openai_compat",
    "quimera.runtime.drivers.repl",
    "quimera.runtime.executor",
    "quimera.runtime.mcp.http_server",
    "quimera.runtime.mcp.server",
    "quimera.runtime.mcp.settings",
    "quimera.runtime.tools.delegate",
    "quimera.runtime.tools.shell",
    "quimera.tasks.executor_pool",
    "quimera.tasks.repository",
    "quimera.tasks.reviewer",
    "quimera.tasks.runner",
    "quimera.tasks.services",
    "quimera.ui.browser",
    "quimera.ui.textual.app",
    "quimera.ui.textual.renderer",
    "quimera.ui.textual.widgets",
]
ignore_errors = true
